name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and test Fortran motor
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake
          ctest --test-dir build/cmake --output-on-failure
      - name: Build and test .NET integration
        run: |
          dotnet restore OrbitalSim.sln -p:NuGetAudit=false
          dotnet build OrbitalSim.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
          dotnet run --project tests/OrbitalSim.IntegrationTests -c Release --no-build
      - name: Run example end to end
        run: |
          dotnet run --project src/OrbitalSim.Cli -c Release --no-build -- run examples/earth-satellite.json --out build/ci-example
          test -s build/ci-example/trajectory.csv
          test -s build/ci-example/diagnostics.csv
          test -s build/ci-example/summary.json
      - name: Build and test React app
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: Run API end to end
        run: |
          dotnet run --project src/OrbitalSim.Api -c Release --no-build --urls http://127.0.0.1:5080 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5080/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' \
            --data-binary @examples/earth-satellite.json \
            http://127.0.0.1:5080/api/simulations > build/ci-api.json
          python3 -c "import json; samples=json.load(open('build/ci-api.json'))['samples']; assert len(samples)==61; assert len(samples[0]['bodies'])==2"
